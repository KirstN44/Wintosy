<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wintosy Blog — Real Life & Reflections</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Lightweight Markdown Parser Script -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: #f7f2eb;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(246, 221, 204, 0.7) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(214, 227, 219, 0.7) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(253, 250, 246, 1) 100%, transparent 100%);
            color: #2e2621;
            line-height: 1.6;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container { max-width: 800px; width: 100%; margin: 0 auto; }
        .back-link {
            display: inline-block;
            color: #6b5842;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 30px;
            transition: color 0.15s ease;
        }
        .back-link:hover { color: #e76f51; }
        header { text-align: center; margin-bottom: 50px; }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3rem;
            font-weight: 600;
            color: #231c17;
            margin-bottom: 10px;
        }
        p.subtitle {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            color: #6e5c4f;
            font-size: 1.15rem;
        }
        .posts-list { display: flex; flex-direction: column; gap: 24px; margin-bottom: 60px; }
        .post-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 12px 32px rgba(90, 75, 60, 0.06);
            border: 2px solid #eadfd3;
            transition: transform 0.2s ease;
        }
        .post-card h2 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.8rem;
            color: #231c17;
            margin-bottom: 14px;
        }
        .post-content {
            font-size: 1rem;
            color: #4a3d33;
            line-height: 1.8;
        }
        .post-content p {
            margin-bottom: 14px;
        }
        .post-content a {
            color: #c85a32;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .post-content a:hover {
            color: #231c17;
        }
        footer {
            border-top: 1px solid #eadfd3;
            width: 100%;
            padding-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: #7a6858;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to Wintosy Home</a>
        
        <header>
            <h1>The Wintosy Blog</h1>
            <p class="subtitle">Gentle thoughts, updates, and stories from our corner.</p>
        </header>

        <div id="full-blog-container" class="posts-list">
            <p style="text-align: center; color: #8c7966; font-style: italic;">Loading reflections...</p>
        </div>

        <footer>
            <span>Wintosy &bull; Built with care for parents, kids, and homes.</span>
        </footer>
    </div>

<script>
  async function loadFullBlog() {
    const container = document.getElementById('full-blog-container');
    try {
      const response = await fetch('https://api.github.com/repos/KirstN44/Wintosy/contents/content/blog');
      if (!response.ok) throw new Error('Could not fetch posts');
      
      const files = await response.json();
      if (!files || files.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #8c7966;">No posts published yet. Check back soon!</p>';
        return;
      }

      container.innerHTML = '';

      for (const file of files) {
        if (file.name.endsWith('.md') || file.name.endsWith('.json')) {
          const fileResponse = await fetch(file.download_url);
          const markdownText = await fileResponse.text();
          
          const titleMatch = markdownText.match(/title:\s*["']?([^"'\n]+)["']?/);
          const title = titleMatch ? titleMatch[1] : file.name.replace('.md', '');
          
          const parts = markdownText.split('---');
          let body = parts.length >= 3 ? parts.slice(2).join('---').trim() : markdownText;

          const article = document.createElement('article');
          article.className = 'post-card';
          // Using marked.parse(body) instead of plain text string replacement so markdown links render as clickable anchors
          article.innerHTML = `
            <h2>${title}</h2>
            <div class="post-content">${marked.parse(body)}</div>
          `;
          container.appendChild(article);
        }
      }
    } catch (error) {
      container.innerHTML = '<p style="text-align: center; color: #8c7966;">Unable to load posts right now.</p>';
    }
  }
  loadFullBlog();
</script>
</body>
</html>
