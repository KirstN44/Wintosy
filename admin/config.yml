backend:
  name: github
  repo: KirstN44/Wintosy
  branch: main

media_folder: "images" # or wherever you store uploaded images
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog" # adjust to your folder path
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
