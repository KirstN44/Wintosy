<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Authenticating...</title>
</head>
<body>
  <script>
    (function() {
      const receiveMessage = (message) => {
        window.opener.postMessage(
          `authorization:github:success:${JSON.stringify({
            token: window.location.hash.match(/access_token=([^&]*)/)?.[1],
            provider: "github"
          })}`,
          window.location.origin
        );
        window.close();
      };
      receiveMessage();
    })();
  </script>
</body>
</html>
